name: Atlas checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:worker
      - run: npm run check:icm && npm run test:catalog && npm run test:connections && npm run test:chronology && npm run test:journey-data && npm run test:reference-data
