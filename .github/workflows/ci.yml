name: Atlas checks
on:
  # GitHub Actions is account-billing-locked. Cloudflare Builds runs automatic checks.
  # Restore push/pull_request triggers after that account issue is resolved.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:worker
      - run: npm run check:icm
      - run: npm run test:data
